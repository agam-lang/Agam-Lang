<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="saffronAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="400" rx="24" fill="url(#bannerBg)"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Left Icon Mark -->
  <g transform="translate(60, 60) scale(0.35)">
    <!-- Hexagon Frame -->
    <polygon points="400,140 625,270 625,530 400,660 175,530 175,270" 
             fill="none" stroke="url(#cyanAccent)" stroke-width="12" filter="url(#glow)"/>
    <polygon points="400,200 573,300 573,500 400,600 227,500 227,300" 
             fill="none" stroke="url(#saffronAccent)" stroke-width="8" filter="url(#glow)"/>
    <!-- Central 'A' (अ) Monad -->
    <path d="M 280 260 L 520 260" stroke="#FFB347" stroke-width="20" stroke-linecap="round"/>
    <path d="M 450 260 L 450 540" stroke="#FFB347" stroke-width="20" stroke-linecap="round"/>
    <path d="M 330 310 C 390 300 420 350 420 380 C 420 410 380 430 350 430" 
          fill="none" stroke="#FF7A00" stroke-width="20" stroke-linecap="round"/>
    <path d="M 350 430 C 400 430 430 470 430 510 C 430 550 380 570 320 550" 
          fill="none" stroke="#FF7A00" stroke-width="20" stroke-linecap="round"/>
    <path d="M 390 430 L 450 430" stroke="#FFB347" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Main Title & Typography -->
  <text x="360" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="4" fill="url(#textGrad)">
    AGAM<tspan fill="#FF9933">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="365" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="1">
    Next-Generation Hardware-Accelerated Systems &amp; AI Language
  </text>

  <text x="365" y="235" font-family="sans-serif" font-size="16" font-weight="400" fill="#FFB347" letter-spacing="2">
    अगम — अनंत ज्ञानम् • PROOF-VERIFIED S-GRADE COMPILER
  </text>

  <!-- Architectural Badges -->
  <g transform="translate(365, 275)">
    <!-- Badge 1: Native LLVM -->
    <rect x="0" y="0" width="145" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="18" r="4" fill="#00E5FF"/>
    <text x="28" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Native LLVM 22</text>

    <!-- Badge 2: GPU / NPU Tile-IR -->
    <rect x="155" y="0" width="165" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="171" cy="18" r="4" fill="#FF9933"/>
    <text x="183" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">GPU/NPU Tile-IR</text>

    <!-- Badge 3: Zero-Copy PyTorch -->
    <rect x="330" y="0" width="170" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="346" cy="18" r="4" fill="#10B981"/>
    <text x="358" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Zero-Copy PyTorch</text>

    <!-- Badge 4: Chāṇakya Sandbox -->
    <rect x="510" y="0" width="155" height="36" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="526" cy="18" r="4" fill="#8B5CF6"/>
    <text x="538" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">OS-Level Sandbox</text>
  </g>
</svg>
